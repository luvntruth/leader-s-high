
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>리더스 하이 - AI 리더십 시뮬레이터</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@latest/dist/web/variable/pretendard-variable.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#3182F6",
                        "primary-dark": "#1B64DA",
                        "navy-deep": "#F9FAFB",
                        "navy-card": "#FFFFFF",
                        "accent-neon": "#3182F6",
                        "accent-amber": "#FF6B35",
                        "text-main": "#191F28",
                        "text-sub": "#8B95A1",
                        "border-base": "#E5E8EB",
                        "surface-2": "#F2F4F6",
                    },
                    fontFamily: {
                        "display": ["Pretendard Variable", "Pretendard", "Noto Sans KR", "sans-serif"],
                        "manrope": ["Pretendard Variable", "Pretendard", "sans-serif"],
                        "space": ["Pretendard Variable", "Pretendard", "sans-serif"]
                    },
                    boxShadow: {
                        'neon-cyan': '0 4px 20px rgba(49, 130, 246, 0.2)',
                        'card': '0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04)',
                        'card-hover': '0 4px 12px rgba(0,0,0,0.08)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
          font-family: 'Pretendard Variable', 'Pretendard', 'Noto Sans KR', sans-serif;
          background-color: #F9FAFB;
          color: #191F28;
          overscroll-behavior-y: none;
          -webkit-tap-highlight-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes pulse-cyan {
            0% { box-shadow: 0 0 0 0 rgba(49, 130, 246, 0.35); }
            70% { box-shadow: 0 0 0 12px rgba(49, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(49, 130, 246, 0); }
        }
        .pulse-cyan { animation: pulse-cyan 2s infinite; }

        /* Visual Novel Style Animations */
        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-2deg); }
            75% { transform: rotate(2deg); }
        }
        .animate-wiggle { animation: wiggle 0.8s ease-in-out infinite; }

        @keyframes glow-pulse {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.15); }
        }
        .animate-glow-pulse { animation: glow-pulse 2s ease-in-out infinite; }

        @keyframes avatar-entrance {
            0% { opacity: 0; transform: scale(0.7) translateY(10px); }
            60% { opacity: 1; transform: scale(1.05) translateY(-3px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-avatar-entrance { animation: avatar-entrance 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

        @keyframes speech-bubble-in {
            0% { opacity: 0; transform: translateX(-15px) scale(0.95); }
            100% { opacity: 1; transform: translateX(0) scale(1); }
        }
        .animate-speech-in { animation: speech-bubble-in 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }

        @keyframes speech-bubble-in-right {
            0% { opacity: 0; transform: translateX(15px) scale(0.95); }
            100% { opacity: 1; transform: translateX(0) scale(1); }
        }
        .animate-speech-in-right { animation: speech-bubble-in-right 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }

        @keyframes float-gentle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        .animate-float { animation: float-gentle 3s ease-in-out infinite; }

        @keyframes typing-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* Speech bubble tail */
        .speech-tail-left::before {
            content: '';
            position: absolute;
            left: -8px;
            top: 18px;
            width: 0;
            height: 0;
            border: 8px solid transparent;
            border-right-color: #F3F4F6;
            border-left: 0;
        }
        .speech-tail-right::after {
            content: '';
            position: absolute;
            right: -8px;
            top: 18px;
            width: 0;
            height: 0;
            border: 8px solid transparent;
            border-left-color: #3182F6;
            border-right: 0;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.3",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@google/genai": "https://esm.sh/@google/genai@^1.40.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>

</head>
<body class="bg-[#F9FAFB] min-h-[100dvh]">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
