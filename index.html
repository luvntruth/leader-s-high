
<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>리더스 하이 - AI 리더십 시뮬레이터</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,100..900;1,100..900&family=Noto+Sans+KR:wght@100..900&family=Manrope:wght@300..800&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary":        "#00F2FF",
                        "primary-dark":   "#00C2CC",
                        "navy-deep":      "#060B18",
                        "navy-card":      "#0F1729",
                        "navy-mid":       "#161D2F",
                        "accent-neon":    "#00F2FF",
                        "accent-amber":   "#FFB800",
                        "accent-purple":  "#9F7AEA",
                        "accent-green":   "#10B981",
                        "text-main":      "#FFFFFF",
                        "text-sub":       "#94A3B8",
                    },
                    fontFamily: {
                        "display": ["Epilogue", "Noto Sans KR", "sans-serif"],
                        "manrope": ["Manrope", "sans-serif"],
                        "space":   ["Space Grotesk", "sans-serif"]
                    },
                    boxShadow: {
                        'neon-cyan':   '0 0 15px rgba(0, 242, 255, 0.35), 0 0 40px rgba(0, 242, 255, 0.12)',
                        'neon-purple': '0 0 15px rgba(159, 122, 234, 0.4), 0 0 40px rgba(159, 122, 234, 0.15)',
                        'neon-amber':  '0 0 15px rgba(255, 184, 0, 0.4),  0 0 40px rgba(255, 184, 0, 0.15)',
                        'neon-green':  '0 0 15px rgba(16, 185, 129, 0.4), 0 0 40px rgba(16, 185, 129, 0.15)',
                        'card':        '0 4px 24px rgba(0,0,0,0.4)',
                        'card-hover':  '0 8px 32px rgba(0,0,0,0.5)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
          font-family: 'Noto Sans KR', sans-serif;
          background-color: #060B18;
          color: #FFFFFF;
          overscroll-behavior-y: none;
          -webkit-tap-highlight-color: transparent;
        }

        /* ── 스크롤바 숨김 ── */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* ── 네온 펄스 ── */
        @keyframes pulse-cyan {
            0%   { box-shadow: 0 0 0 0   rgba(0, 242, 255, 0.5); }
            70%  { box-shadow: 0 0 0 18px rgba(0, 242, 255, 0); }
            100% { box-shadow: 0 0 0 0   rgba(0, 242, 255, 0); }
        }
        .pulse-cyan { animation: pulse-cyan 2s infinite; }

        @keyframes pulse-amber {
            0%   { box-shadow: 0 0 0 0   rgba(255,184,0, 0.5); }
            70%  { box-shadow: 0 0 0 14px rgba(255,184,0, 0); }
            100% { box-shadow: 0 0 0 0   rgba(255,184,0, 0); }
        }
        .pulse-amber { animation: pulse-amber 2s infinite; }

        /* ── 별 반짝임 (Profile 배경용) ── */
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50%       { opacity: 1;   transform: scale(1.4); }
        }
        .star { animation: twinkle var(--dur, 3s) ease-in-out infinite; animation-delay: var(--delay, 0s); }

        /* ── XP 바 채우기 애니메이션 ── */
        @keyframes xp-fill {
            from { width: 0; }
        }
        .xp-bar-fill { animation: xp-fill 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

        /* ── 레벨업 플래시 ── */
        @keyframes level-up-flash {
            0%   { opacity: 0; transform: scale(0.8); }
            30%  { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0; transform: scale(1.2); }
        }
        .animate-level-up { animation: level-up-flash 1.5s ease-out forwards; }

        /* ── 캐릭터 흔들기 ── */
        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg); }
            25%       { transform: rotate(-3deg); }
            75%       { transform: rotate(3deg); }
        }
        .animate-wiggle { animation: wiggle 0.8s ease-in-out infinite; }

        /* ── 글로우 펄스 ── */
        @keyframes glow-pulse {
            0%, 100% { filter: brightness(1); }
            50%       { filter: brightness(1.2); }
        }
        .animate-glow-pulse { animation: glow-pulse 2s ease-in-out infinite; }

        /* ── 아바타 등장 ── */
        @keyframes avatar-entrance {
            0%   { opacity: 0; transform: scale(0.7) translateY(12px); }
            60%  { opacity: 1; transform: scale(1.06) translateY(-4px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-avatar-entrance { animation: avatar-entrance 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

        /* ── 말풍선 ── */
        @keyframes speech-bubble-in {
            0%   { opacity: 0; transform: translateX(-16px) scale(0.94); }
            100% { opacity: 1; transform: translateX(0) scale(1); }
        }
        .animate-speech-in { animation: speech-bubble-in 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }

        @keyframes speech-bubble-in-right {
            0%   { opacity: 0; transform: translateX(16px) scale(0.94); }
            100% { opacity: 1; transform: translateX(0) scale(1); }
        }
        .animate-speech-in-right { animation: speech-bubble-in-right 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }

        /* ── 두둥실 ── */
        @keyframes float-gentle {
            0%, 100% { transform: translateY(0); }
            50%       { transform: translateY(-5px); }
        }
        .animate-float { animation: float-gentle 3s ease-in-out infinite; }

        /* ── Trust 드롭 흔들기 ── */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%       { transform: translateX(-6px); }
            40%       { transform: translateX(6px); }
            60%       { transform: translateX(-4px); }
            80%       { transform: translateX(4px); }
        }
        .animate-shake { animation: shake 0.5s ease-in-out; }

        /* ── Trust 플래시 오버레이 ── */
        @keyframes red-flash {
            0%   { opacity: 0.35; }
            100% { opacity: 0; }
        }
        .animate-red-flash { animation: red-flash 0.7s ease-out forwards; }

        /* ── 말풍선 꼬리 ── */
        .speech-tail-left::before {
            content: '';
            position: absolute;
            left: -9px; top: 20px;
            width: 0; height: 0;
            border: 9px solid transparent;
            border-right-color: #1a2540;
            border-left: 0;
        }
        .speech-tail-right::after {
            content: '';
            position: absolute;
            right: -9px; top: 20px;
            width: 0; height: 0;
            border: 9px solid transparent;
            border-left-color: #00C2CC;
            border-right: 0;
        }

        /* ── 퀘스트 보드 그리드 패턴 ── */
        .quest-board-bg {
            background-color: #060B18;
            background-image:
                linear-gradient(rgba(0,242,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,242,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* ── 스캔라인 효과 (게임 오버레이) ── */
        .scanlines::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                to bottom,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.08) 2px,
                rgba(0,0,0,0.08) 4px
            );
            pointer-events: none;
            z-index: 1;
        }

        /* ── 육각형 뱃지 클리핑 ── */
        .hexagon {
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }

        /* ── HP 바 세그먼트 (게임 체력바 느낌) ── */
        .hp-bar-glow {
            box-shadow: 0 0 12px currentColor, 0 0 6px currentColor;
        }

        /* ── 퀘스트 카드 핀 장식 ── */
        .quest-pin::before {
            content: '';
            position: absolute;
            top: -6px; left: 50%;
            transform: translateX(-50%);
            width: 12px; height: 12px;
            background: #FFB800;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255,184,0,0.6);
        }

        /* ── 타이핑 점 bounce ── */
        @keyframes typing-bounce {
            0%, 100% { transform: translateY(0); }
            50%       { transform: translateY(-6px); }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",

    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>

</head>
<body class="bg-[#060B18] min-h-[100dvh]">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
