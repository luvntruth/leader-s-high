<!DOCTYPE html>
<html lang="ko" class="dark">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
        name="viewport" />

    <!-- SEO -->
    <meta name="description" content="AI 팀원과 실전 리더십 대화를 연습하세요. 40가지 시나리오, 실시간 코칭, 즉각적인 역량 리포트. Leader's High - AI 리더십 훈련 플랫폼" />
    <meta name="keywords" content="리더십 훈련, AI 코칭, 팀장 교육, MZ세대 소통, 리더십 시뮬레이션, 피드백 연습" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Leader's High - AI 리더십 훈련 플랫폼" />
    <meta property="og:description" content="AI 팀원과 실전 리더십 대화를 연습하고, 실시간 코칭과 역량 리포트를 받으세요." />
    <meta property="og:url" content="https://leader-s-high.vercel.app" />
    <meta property="og:locale" content="ko_KR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Leader's High - AI 리더십 훈련 플랫폼" />
    <meta name="twitter:description" content="AI 팀원과 실전 리더십 대화를 연습하고, 실시간 코칭과 역량 리포트를 받으세요." />

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>" />

    <!-- PortOne V2 SDK -->
    <script src="https://cdn.portone.io/v2/browser-sdk.js"></script>

    <title>리더스 하이 - AI 리더십 시뮬레이터</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,100..900;1,100..900&family=Noto+Sans+KR:wght@100..900&family=Manrope:wght@300..800&family=Space+Grotesk:wght@300..700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #060B18;
            color: #FFFFFF;
            -webkit-tap-highlight-color: transparent;
        }

        /* ── 스크롤바 숨김 ── */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* ── 네온 펄스 ── */
        @keyframes pulse-cyan {
            0% {
                box-shadow: 0 0 0 0 rgba(0, 242, 255, 0.5);
            }

            70% {
                box-shadow: 0 0 0 18px rgba(0, 242, 255, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(0, 242, 255, 0);
            }
        }

        .pulse-cyan {
            animation: pulse-cyan 2s infinite;
        }

        @keyframes pulse-amber {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 184, 0, 0.5);
            }

            70% {
                box-shadow: 0 0 0 14px rgba(255, 184, 0, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(255, 184, 0, 0);
            }
        }

        .pulse-amber {
            animation: pulse-amber 2s infinite;
        }

        /* ── 별 반짝임 (Profile 배경용) ── */
        @keyframes twinkle {

            0%,
            100% {
                opacity: 0.2;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.4);
            }
        }

        .star {
            animation: twinkle var(--dur, 3s) ease-in-out infinite;
            animation-delay: var(--delay, 0s);
        }

        /* ── XP 바 채우기 애니메이션 ── */
        @keyframes xp-fill {
            from {
                width: 0;
            }
        }

        .xp-bar-fill {
            animation: xp-fill 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* ── 레벨업 플래시 ── */
        @keyframes level-up-flash {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }

            30% {
                opacity: 1;
                transform: scale(1.05);
            }

            100% {
                opacity: 0;
                transform: scale(1.2);
            }
        }

        .animate-level-up {
            animation: level-up-flash 1.5s ease-out forwards;
        }

        /* ── 캐릭터 흔들기 ── */
        @keyframes wiggle {

            0%,
            100% {
                transform: rotate(0deg);
            }

            25% {
                transform: rotate(-3deg);
            }

            75% {
                transform: rotate(3deg);
            }
        }

        .animate-wiggle {
            animation: wiggle 0.8s ease-in-out infinite;
        }

        /* ── 글로우 펄스 ── */
        @keyframes glow-pulse {

            0%,
            100% {
                filter: brightness(1);
            }

            50% {
                filter: brightness(1.2);
            }
        }

        .animate-glow-pulse {
            animation: glow-pulse 2s ease-in-out infinite;
        }

        /* ── 아바타 등장 ── */
        @keyframes avatar-entrance {
            0% {
                opacity: 0;
                transform: scale(0.7) translateY(12px);
            }

            60% {
                opacity: 1;
                transform: scale(1.06) translateY(-4px);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .animate-avatar-entrance {
            animation: avatar-entrance 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* ── 말풍선 ── */
        @keyframes speech-bubble-in {
            0% {
                opacity: 0;
                transform: translateX(-16px) scale(0.94);
            }

            100% {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        .animate-speech-in {
            animation: speech-bubble-in 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes speech-bubble-in-right {
            0% {
                opacity: 0;
                transform: translateX(16px) scale(0.94);
            }

            100% {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        .animate-speech-in-right {
            animation: speech-bubble-in-right 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        /* ── 두둥실 ── */
        @keyframes float-gentle {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        .animate-float {
            animation: float-gentle 3s ease-in-out infinite;
        }

        /* ── Trust 드롭 흔들기 ── */
        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-6px);
            }

            40% {
                transform: translateX(6px);
            }

            60% {
                transform: translateX(-4px);
            }

            80% {
                transform: translateX(4px);
            }
        }

        .animate-shake {
            animation: shake 0.5s ease-in-out;
        }

        /* ── Trust 플래시 오버레이 ── */
        @keyframes red-flash {
            0% {
                opacity: 0.35;
            }

            100% {
                opacity: 0;
            }
        }

        .animate-red-flash {
            animation: red-flash 0.7s ease-out forwards;
        }

        /* ── Trust 증가 플래시 (Heal) ── */
        @keyframes blue-flash {
            0% {
                opacity: 0.35;
            }

            100% {
                opacity: 0;
            }
        }

        .animate-blue-flash {
            animation: blue-flash 0.7s ease-out forwards;
        }

        /* ── 비네트 효과 (위험/안정) ── */
        @keyframes vignette-pulse {

            0%,
            100% {
                opacity: 0.4;
            }

            50% {
                opacity: 0.7;
            }
        }

        .vignette-danger {
            box-shadow: inset 0 0 150px rgba(239, 68, 68, 0.5);
            pointer-events: none;
            z-index: 40;
            animation: vignette-pulse 2s ease-in-out infinite;
        }

        .vignette-safe {
            box-shadow: inset 0 0 100px rgba(0, 242, 255, 0.3);
            pointer-events: none;
            z-index: 40;
        }

        /* ── 경고 펄스 (Critical Status) ── */
        @keyframes pulse-red {

            0%,
            100% {
                box-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
                border-color: rgba(239, 68, 68, 0.6);
            }

            50% {
                box-shadow: 0 0 25px rgba(239, 68, 68, 0.8);
                border-color: rgba(239, 68, 68, 1);
            }
        }

        .pulse-red {
            animation: pulse-red 1.5s ease-in-out infinite;
        }

        /* ── 글로우 펄스 (업데이트) ── */
        @keyframes glow-pulse {

            0%,
            100% {
                filter: drop-shadow(0 0 5px currentColor) brightness(1);
            }

            50% {
                filter: drop-shadow(0 0 15px currentColor) brightness(1.3);
            }
        }

        .animate-glow-pulse {
            animation: glow-pulse 2s ease-in-out infinite;
        }

        /* ── 스캔라인 애니메이션 ── */
        @keyframes scanline {
            0% {
                transform: translateY(-100%);
            }

            100% {
                transform: translateY(100%);
            }
        }

        .animate-scanline {
            animation: scanline 4s linear infinite;
        }

        /* ── TeamOffice 스캔 라인 ── */
        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }

        .animate-scan {
            animation: scan 1.2s linear forwards;
        }

        /* ── 콤뱃 텍스트 (Floating Numbers) ── */
        @keyframes combat-text {
            0% {
                opacity: 0;
                transform: translateY(0) scale(0.5);
            }

            20% {
                opacity: 1;
                transform: translateY(-20px) scale(1.2);
            }

            80% {
                opacity: 1;
                transform: translateY(-40px) scale(1.1);
            }

            100% {
                opacity: 0;
                transform: translateY(-60px) scale(1);
            }
        }

        .animate-combat-text {
            animation: combat-text 1.5s ease-out forwards;
        }

        /* ── 말풍선 꼬리 ── */
        .speech-tail-left::before {
            content: '';
            position: absolute;
            left: -9px;
            top: 20px;
            width: 0;
            height: 0;
            border: 9px solid transparent;
            border-right-color: #1a2540;
            border-left: 0;
        }

        .speech-tail-right::after {
            content: '';
            position: absolute;
            right: -9px;
            top: 20px;
            width: 0;
            height: 0;
            border: 9px solid transparent;
            border-left-color: #00C2CC;
            border-right: 0;
        }

        /* ── 퀘스트 보드 그리드 패턴 ── */
        .quest-board-bg {
            background-color: #060B18;
            background-image:
                linear-gradient(rgba(0, 242, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* ── 스캔라인 효과 (게임 오버레이) ── */
        .scanlines::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(to bottom,
                    transparent,
                    transparent 2px,
                    rgba(0, 0, 0, 0.08) 2px,
                    rgba(0, 0, 0, 0.08) 4px);
            pointer-events: none;
            z-index: 1;
        }

        /* ── 육각형 뱃지 클리핑 ── */
        .hexagon {
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }

        /* ── HP 바 세그먼트 (게임 체력바 느낌) ── */
        .hp-bar-glow {
            box-shadow: 0 0 12px currentColor, 0 0 6px currentColor;
        }

        /* ── 퀘스트 카드 핀 장식 ── */
        .quest-pin::before {
            content: '';
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 12px;
            background: #FFB800;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255, 184, 0, 0.6);
        }

        /* ── 타이핑 점 bounce ── */
        @keyframes typing-bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }
        }

        /* ══════════════════════════════════════════
           Phase 1 : 게임 UI 디자인 시스템 확장
           ══════════════════════════════════════════ */

        /* ── 골드 반짝임 ── */
        @keyframes shimmer {
            0% {
                background-position: -200% center;
            }

            100% {
                background-position: 200% center;
            }
        }

        .animate-shimmer {
            background: linear-gradient(90deg, transparent 30%, rgba(255, 215, 0, 0.15) 50%, transparent 70%);
            background-size: 200% 100%;
            animation: shimmer 2.5s ease-in-out infinite;
        }

        /* ── 프로그레스 바 차오르기 ── */
        @keyframes bar-fill {
            from {
                transform: scaleX(0);
            }

            to {
                transform: scaleX(1);
            }
        }

        .animate-bar-fill {
            transform-origin: left;
            animation: bar-fill 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* ── 스탬프 찍기 (QUEST CLEAR) ── */
        @keyframes stamp-in {
            0% {
                opacity: 0;
                transform: scale(3) rotate(-15deg);
            }

            60% {
                opacity: 1;
                transform: scale(0.9) rotate(-12deg);
            }

            80% {
                transform: scale(1.05) rotate(-12deg);
            }

            100% {
                opacity: 1;
                transform: scale(1) rotate(-12deg);
            }
        }

        .animate-stamp-in {
            animation: stamp-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* ── 홀로그램 스캔라인 ── */
        @keyframes hologram-scan {
            0% {
                top: -100%;
            }

            100% {
                top: 200%;
            }
        }

        .hologram-line::before {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(0, 242, 255, 0.3), transparent);
            animation: hologram-scan 3s linear infinite;
        }

        /* ── 에너지 웨이브 ── */
        @keyframes energy-wave {
            0% {
                opacity: 0.6;
                transform: scale(1);
            }

            100% {
                opacity: 0;
                transform: scale(2.5);
            }
        }

        .animate-energy-wave {
            animation: energy-wave 1.5s ease-out infinite;
        }

        /* ── 게임 카드 (공통) ── */
        .game-card {
            background: linear-gradient(135deg, rgba(15, 23, 41, 0.95), rgba(6, 11, 24, 0.98));
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 1.5rem;
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .game-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(135deg, rgba(0, 242, 255, 0.1), transparent 60%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .game-card:hover {
            border-color: rgba(0, 242, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 242, 255, 0.05);
            transform: translateY(-2px);
        }

        /* ── 게임 뱃지 등급 ── */
        .game-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.25rem 0.625rem;
            border-radius: 0.375rem;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        /* ── 게임 프로그레스 바 ── */
        .game-progress-bar {
            height: 0.5rem;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.05);
            overflow: hidden;
            position: relative;
        }

        .game-progress-bar .fill {
            height: 100%;
            border-radius: inherit;
            transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative;
        }

        .game-progress-bar .fill::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent 30%, rgba(255, 255, 255, 0.2) 50%, transparent 70%);
            background-size: 200% 100%;
            animation: shimmer 2s ease-in-out infinite;
        }

        /* ── 네온 글로우 텍스트 ── */
        .game-glow-text {
            text-shadow: 0 0 10px currentColor, 0 0 30px currentColor;
        }

        /* ── 게임 HUD 프레임 ── */
        .game-hud-frame {
            border: 1px solid rgba(0, 242, 255, 0.15);
            background: rgba(6, 11, 24, 0.85);
            backdrop-filter: blur(16px);
            border-radius: 1rem;
        }

        /* ── 커맨드 센터 그리드 배경 ── */
        .command-center-bg {
            background-color: #060B18;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(0, 242, 255, 0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(159, 122, 234, 0.03) 0%, transparent 50%),
                linear-gradient(rgba(0, 242, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
        }

        /* ── 게임 섹션 구분선 ── */
        .neon-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 242, 255, 0.2), transparent);
        }

        /* ── 카드 호버 틸트 ── */
        .game-card-tilt:hover {
            transform: perspective(800px) rotateY(-2deg) rotateX(1deg) translateY(-4px);
        }

        /* ── QUEST CLEAR 등장 ── */
        @keyframes quest-clear-reveal {
            0% {
                opacity: 0;
                transform: scale(2.5) rotate(-5deg);
                filter: blur(8px);
            }

            50% {
                opacity: 1;
                transform: scale(0.95) rotate(0deg);
                filter: blur(0);
            }

            70% {
                transform: scale(1.08) rotate(1deg);
            }

            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
                filter: blur(0);
            }
        }

        .animate-quest-clear {
            animation: quest-clear-reveal 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* ── 스킬 언락 펄스 ── */
        @keyframes skill-unlock {
            0% {
                box-shadow: 0 0 0 0 rgba(0, 242, 255, 0.6);
            }

            50% {
                box-shadow: 0 0 30px 10px rgba(0, 242, 255, 0.3);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(0, 242, 255, 0.0);
            }
        }

        .animate-skill-unlock {
            animation: skill-unlock 2s ease-out infinite;
        }

        /* ── 카운트업 ── */
        @keyframes count-up-bar {
            0% {
                width: 0%;
            }
        }

        /* ── 랭크 배지 색상 ── */
        .rank-s {
            color: #fbbf24;
            text-shadow: 0 0 8px rgba(251, 191, 36, 0.6);
        }

        .rank-a {
            color: #a78bfa;
            text-shadow: 0 0 8px rgba(167, 139, 250, 0.5);
        }

        .rank-b {
            color: #00f2ff;
            text-shadow: 0 0 8px rgba(0, 242, 255, 0.5);
        }

        .rank-c {
            color: #34d399;
            text-shadow: 0 0 6px rgba(52, 211, 153, 0.4);
        }

        .rank-d {
            color: #94a3b8;
        }

        /* ── 전투 결과 카드 글로우 ── */
        .battle-card-glow:hover {
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.15), 0 8px 32px rgba(0, 0, 0, 0.3);
            border-color: rgba(0, 242, 255, 0.3) !important;
        }
    </style>

</head>

<body class="bg-[#060B18] min-h-[100dvh]">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
